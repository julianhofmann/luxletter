<div class="panel panel-default">
    <div class="panel-body">
        <f:form name="filter" class="form" action="{action}" object="{filter}">
            <div class="row">
                <div class="col-md-8"></div>
                <div class="col-md-2">
                    <div class="input-group form-group">
                        <f:form.select
                            id="site"
                            class="form-control form-select"
                            property="site"
                            options="{filter.allowedSites}"
                            prependOptionLabel="{f:translate(key:'LLL:EXT:lux/Resources/Private/Language/locallang_db.xlf:module.analysis.dashboard.filter.sitesall')}"
                            prependOptionValue=""
                            optionValueField="identifier"
                            optionLabelField="configuration.websiteTitle"
                            value="{filter.site}"
                            additionalAttributes="{onchange:'this.form.submit();'}" />
                        <luxletter:condition.isTypo3Eleven>
                            <f:then>
                                <label class="btn btn-default" for="site">
                                    <span class="fa fa-globe"></span>
                                </label>
                            </f:then>
                            <f:else>
                                <label class="input-group-addon fa fa-globe" for="site"></label>
                            </f:else>
                        </luxletter:condition.isTypo3Eleven>
                    </div>
                </div>
                <div class="col-md-2">
                    <div class="input-group form-group">
                        <f:form.select
                            property="time"
                            options="{filter.timeOptions}"
                            class="form-control form-select"
                            id="time"
                            additionalAttributes="{onchange:'this.form.submit();'}" />
                        <luxletter:condition.isTypo3Eleven>
                            <f:then>
                                <label class="btn btn-default" for="time">
                                    <span class="fa fa-calendar"></span>
                                </label>
                            </f:then>
                            <f:else>
                                <label class="input-group-addon fa fa-calendar" for="time"></label>
                            </f:else>
                        </luxletter:condition.isTypo3Eleven>
                    </div>
                </div>
            </div>
        </f:form>
    </div>
</div>
